#===============================================================================
# router.conf — центральный конфиг сетевых параметров router_service
#
# ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ для адресации LAN.
# Этот файл разворачивается в /usr/local/etc/router_service/router.conf
# скриптом install.sh.
#
# Как изменить сеть:
#   1. Отредактируйте значения в этом файле.
#   2. Выполните: sudo router_service_ctl apply-network
#      (сгенерирует kea-dhcp4 из шаблона и применит статический IP
#      через NetworkManager/nmcli)
#   3. Либо вручную: sudo gen_network_config.sh
#
# ВАЖНО: /etc/netplan НЕ используется — NetworkManager на этой системе
# удаляет чужие файлы из /etc/netplan, поэтому сеть применяется через nmcli
# на подключении NM_CONN.
#
# Относительно этих значений генерируются:
#   - /etc/netplan/01-router-eth0.yaml  (статический IP, шлюз, DNS)
#   - /etc/kea/kea-dhcp4.conf           (подсеть, пул DHCP, шлюз/DNS для клиентов)
# а скрипты router_service_init.sh, router_service_ctl и test_connectivity.sh
# берут адреса из этого файла (с fallback на встроенные дефолты).
#===============================================================================

# Сетевой интерфейс LAN (к нему подключены клиенты)
IFACE=eth0

# Имя подключения NetworkManager для интерфейса LAN.
# Статический IP применяется через nmcli (на этой системе NetworkManager —
# глобальный рендерер и удаляет чужие файлы из /etc/netplan).
NM_CONN=netplan-eth0

# IP-адрес домашнего роутера (вышестоящий шлюз, по умолчанию для RPi5)
ROUTER_IP=192.168.3.1

# Статический IP-адрес RPi5 (шлюз и DNS для клиентов LAN)
RPI5_IP=192.168.3.2

# Подсеть LAN в CIDR-нотации.
# Netmask и broadcast-адрес вычисляются автоматически из префикса.
LAN_SUBNET=192.168.3.0/24

# Пул адресов, раздаваемых DHCP-сервером Kea клиентам LAN
LAN_POOL_START=192.168.3.100
LAN_POOL_END=192.168.3.250

# Upstream DNS для самого RPi5 (используются в netplan).
# Клиенты LAN получают DNS = RPI5_IP (dnsmasq → Pi-hole → dnscrypt-proxy).
DNS1=1.1.1.1
DNS2=8.8.8.8
