<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Вход — routerd</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <div class="halo" aria-hidden="true"></div>

  <main class="stage">
    <svg class="lock" id="lock" viewBox="0 -16 96 128" aria-hidden="true">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e5e7eb"/>
          <stop offset="0.5" stop-color="#9ca3af"/>
          <stop offset="1" stop-color="#4b5563"/>
        </linearGradient>
        <linearGradient id="bodyfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1f2937"/>
          <stop offset="1" stop-color="#05070b"/>
        </linearGradient>
      </defs>
      <path class="shackle" d="M27 52 V34 a21 21 0 0 1 42 0 V52"/>
      <rect class="flash" x="10" y="46" width="76" height="62" rx="14"/>
      <rect class="body" x="10" y="46" width="76" height="62" rx="14"/>
      <path class="keyhole" d="M48 66 a7 7 0 0 1 3.5 13.06 V90 h-7 V79.06 A7 7 0 0 1 48 66 z"/>
    </svg>

    <section class="card" id="card">
      <h1>routerd</h1>
      <p class="subtitle">Панель управления шлюзом</p>

      <form id="login-form" novalidate>
        <label class="field">
          <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " required>
          <span>Логин</span>
        </label>
        <label class="field">
          <input name="password" type="password" autocomplete="current-password" placeholder=" " required>
          <span>Пароль</span>
        </label>
        <label class="toggle">
          <input type="checkbox" name="remember">
          <span class="track"></span>
          <span>Запомнить устройство на 30 дней</span>
        </label>
        <p id="error" class="error" role="alert" hidden></p>
        <button class="btn" type="submit">Войти</button>
      </form>
    </section>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
