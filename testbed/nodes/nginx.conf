# nginx удалённого узла стенда: :443 — stream с выбором по SNI
# без расшифровки; data.<узел> — GOST, остальное — веб-сайт узла.
# Подстановки lab.sh: @NAME@ — узел (entry, exit), @DIR@ — каталог узла, @PKI@.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
user www-data;
worker_processes 1;
pid @DIR@/nginx.pid;
error_log stderr;
events { worker_connections 256; }

stream {
    map $ssl_preread_server_name $sni_name {
        hostnames;
        data.@NAME@.example gost;
        default             www;
    }
    upstream gost { server 127.0.0.1:9443; }
    upstream www  { server 127.0.0.1:7443; }

    server {
        listen 443;
        proxy_pass $sni_name;
        proxy_protocol on;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

http {
    access_log off;
    client_body_temp_path @DIR@/tmp;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server {
        listen 127.0.0.1:7443 ssl proxy_protocol;
        server_name www.@NAME@.example;
        ssl_certificate @PKI@/@NAME@-fullchain.crt;
        ssl_certificate_key @PKI@/@NAME@.key;
        root @DIR@/www;
    }
}
