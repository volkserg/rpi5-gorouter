# router.conf стенда: адреса совпадают с топологией lab.sh
IFACE=eth0
ROUTER_IP=192.168.3.1
RPI5_IP=192.168.3.2
LAN_SUBNET=192.168.3.0/24
LAN_POOL_START=192.168.3.100
LAN_POOL_END=192.168.3.250
DNS1=203.0.113.53
DNS2=203.0.113.53

VPN_MODE=redirect
VPN_PORT=1080
QUIC_REJECT=yes
# На стенде короткий таймаут — чтобы проверять истечение записей.
VPN_DYNAMIC_TIMEOUT=30s
DNS_UPSTREAM=127.0.0.1#5353
# Локальный сервис стенда (lab-local-app.service из deploy/systemd/local-app.service).
LOCAL_CLIENTS="lab-app:10.99.0.0/30"
