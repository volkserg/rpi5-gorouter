#===============================================================================
# router.conf — конфиг routerd (/usr/local/etc/router_service/router.conf)
#
# Формат KEY=value (присваивания shell); пустое или отсутствующее значение
# заменяется значением по умолчанию (указано ниже).
# Проверка:  rsc check-config
# Применить: rsc reload-vpn-domains   (без перезапуска)
#            rsc apply-network        (адрес RPi в NetworkManager)
#===============================================================================

#--- Сеть LAN ------------------------------------------------------------------

# Интерфейс LAN и подключение NetworkManager для apply-network.
IFACE=eth0
NM_CONN=netplan-eth0

# Домашний роутер (шлюз RPi) и адрес самой RPi — шлюз и DNS для клиентов.
ROUTER_IP=192.168.3.1
RPI5_IP=192.168.3.2
LAN_SUBNET=192.168.3.0/24

# Пул DHCP.
LAN_POOL_START=192.168.3.100
LAN_POOL_END=192.168.3.250

# DNS самой RPi (apply-network); клиенты LAN получают DNS = RPI5_IP.
DNS1=1.1.1.1
DNS2=8.8.8.8

#--- DHCP ----------------------------------------------------------------------

# yes — routerd раздаёт адреса в LAN (DHCP на роутере нужно выключить).
#DHCP_ENABLED=yes
#DHCP_LEASE_TIME=24h
# Домен LAN: клиенты доступны по имени <hostname>.lan, PTR — тоже.
#LOCAL_DOMAIN=lan

#--- Туннель -------------------------------------------------------------------

# Как трафик к адресам из vpn_domains.txt попадает в туннель (GOST, gost-run.service):
#   redirect — TCP через REDIRECT на gost -L red://:VPN_PORT
#   tproxy   — TCP и UDP через TPROXY на gost -L red://:VPN_PORT?tproxy=true -L redu://:VPN_PORT
#   route    — весь IP через интерфейс VPN_TUN (gost -L tun://…)
#VPN_MODE=redirect
#VPN_PORT=1080
#VPN_TUN=tun0
# systemd-юнит клиента туннеля, которым управляют rsc start/stop/status/logs
# (суффикс .service можно не писать).
#VPN_SERVICE=gost-run.service
# Туннель недоступен: closed — адреса из списка недоступны (по умолчанию),
# open — трафик к ним идёт напрямую, пока туннель не вернётся.
#VPN_FAILOVER=closed
# Отклонять QUIC (UDP/443) к адресам из списка — браузер перейдёт на TCP.
#QUIC_REJECT=yes
# Сколько адрес, полученный из DNS-ответа, остаётся в списке (не меньше TTL).
#VPN_DYNAMIC_TIMEOUT=24h

#--- DNS -----------------------------------------------------------------------

# Цепочка: клиент → routerd :53 → Pi-hole DNS_UPSTREAM → dnscrypt-proxy DNSCRYPT_ADDR.
#DNS_UPSTREAM=127.0.0.1#5353
#DNSCRYPT_ADDR=127.0.0.1#5053
# Передавать Pi-hole адрес клиента (EDNS Client Subnet) — в статистике
# Pi-hole видны клиенты, а не 127.0.0.1.
#DNS_ECS=yes
# Пустой ответ на AAAA: vpn — для доменов из списка, all — для всех, none — нет.
#FILTER_AAAA=vpn

#--- Pi-hole -------------------------------------------------------------------

# yes — routerd сверяет в pihole.toml порт, upstream, ECS и revServers
# и при расхождении исправляет их (FTL перезапускается).
#PIHOLE_MANAGE=yes
#PIHOLE_TOML=/etc/pihole/pihole.toml

#--- Локальные сервисы ---------------------------------------------------------

# Сервисы на самой RPi, трафик которых routerd обрабатывает как трафик
# устройств LAN (списки, туннель, DNS). Формат: «имя:подсеть» через пробел.
# Каждому — свой network namespace /run/netns/<имя> (юнит routerd-local@<имя>)
# и veth-пара rc-<имя>: первый адрес подсети — RPi, второй — сервис.
# Имя — до 12 символов [a-z0-9-]; подсеть /24–/30, не пересекается с
# LAN_SUBNET, подсетями из vpn_domains.txt и подсетью tun в режиме route.
# Подключение юнита сервиса — deploy/systemd/local-app.service.
# После смены подсети: sudo systemctl restart routerd-local@<имя>.
#LOCAL_CLIENTS="app:10.99.0.0/30"

#--- Веб-интерфейс -------------------------------------------------------------

# Панель управления: https://RPI5_IP:WEB_PORT (юнит routerd-web.service,
# самоподписанный сертификат). Пользователи — sudo routerd web passwd <логин>.
# После смены WEB_UI: sudo systemctl enable --now routerd-web (или disable --now);
# install.sh и роль делают это сами.
#WEB_UI=no
#WEB_PORT=8443
# Сутки истории обращений устройств (раздел «Обращения»: какие ресурсы,
# успешно или нет, напрямую или через туннель). История — на RPi
# (/var/lib/routerd/history); 0 — обращения не учитываются.
#ACCESS_HISTORY_DAYS=7
