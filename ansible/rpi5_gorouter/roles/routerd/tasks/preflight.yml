---
- name: Платформа — Linux arm64 с systemd
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture in ['aarch64', 'arm64']
      - ansible_service_mgr == 'systemd'
    fail_msg: "routerd собирается под linux/arm64 и работает под systemd"
    quiet: true

- name: Список задан одним способом
  ansible.builtin.assert:
    that:
      - routerd_vpn_entries is none or routerd_vpn_file is none
      - routerd_dns_overrides is none or routerd_dns_override_file is none
    fail_msg: "задайте либо routerd_vpn_entries, либо routerd_vpn_file (и так же для dns_override)"
    quiet: true

- name: Имена команд управления
  ansible.builtin.stat:
    path: "{{ routerd_bin_dir }}/{{ item }}"
  loop: "{{ _routerd_ctl_names }}"
  register: _routerd_ctl_stat

# Свободно или symlink на routerd; другое — файл или ссылка на чужую программу.
# fail_msg не обращается к item.stat.path: у несуществующего файла его нет, а
# ansible-core 2.19+ вычисляет сообщение и при успешной проверке.
- name: Имена команд не заняты другой программой
  ansible.builtin.assert:
    that: >-
      not item.stat.exists
      or (item.stat.islnk and item.stat.lnk_source == routerd_bin_dir ~ '/routerd')
    fail_msg: "{{ routerd_bin_dir }}/{{ item.item }} — не symlink на routerd: уберите или переименуйте его"
    quiet: true
  loop: "{{ _routerd_ctl_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
